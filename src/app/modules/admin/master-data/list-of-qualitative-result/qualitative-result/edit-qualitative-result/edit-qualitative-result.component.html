<div class="flex w-full flex-col">
    <!-- VIEW MODE STARTS -->
    <form [formGroup]="qualitativeResultUpdateForm" (ngSubmit)="onUpdateQualitativeResult()">
        @if (!editMode) {
        <div class="flex w-full flex-col">
            <!-- HEADER -->
            <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12"
                style="background-image: linear-gradient(#233041, #1E293B);">
                <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
                    Qualitative Result
                </div>
            </div>
            <!-- MAIN -->
            <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
                <div class="w-full max-w-3xl">
                    <div class="mb-1 mt-2 flex justify-end">
                        <button mat-flat-button [color]="'primary'" (click)="toggleEditMode(true)">
                            <mat-icon class="icon-size-5 mat-icon-primary"
                                [svgIcon]="'heroicons_solid:pencil-square'"></mat-icon>
                            <span class="ml-auto">&nbsp;Edit</span>
                        </button>
                    </div>
                    <!-- id -->
                    <div class="mt-8 view-mode cursor-no-drop hidden" [matTooltip]="'Id can not be update.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>ID</mat-label>
                            <input matInput formControlName="id" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; " readonly />
                        </mat-form-field>
                    </div>
                    <!-- Code -->
                    <div class="mt-8 view-mode cursor-no-drop" [matTooltip]="'You are in view mode.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Code</mat-label>
                            <input matInput formControlName="qrCode" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; " readonly />
                        </mat-form-field>
                    </div>
                    <!-- Description -->
                    <div class="mt-8 view-mode cursor-no-drop" [matTooltip]="'You are in view mode.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Code</mat-label>
                            <input matInput formControlName="resultDescription" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; border-radius: 1px !important "
                                readonly />
                        </mat-form-field>
                    </div>
                    <!-- Active / InActive  -->
                    <div class="mt-4 view-mode">
                        <div class="flex items-center">
                            <mat-checkbox formControlName="isActive" class="mr-2"></mat-checkbox>
                            <label class="text-lg">Active</label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        }
        <!-- VIEW MODE ENDS -->
        <!-- EDIT MODE STARTS -->
        @if (editMode) {
        <div class="flex w-full flex-col">
            <!-- HEADER -->
            <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12"
                style="background-image: linear-gradient(#233041, #1E293B);">
                <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
                    Qualitative Result
                </div>
            </div>
            <!-- MAIN -->
            <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
                <div class="w-full max-w-3xl">
                    <div class="mb-1 mt-2 flex justify-end">
                        <button mat-flat-button [color]="'primary'" (click)="toggleEditMode(false)">
                            <mat-icon class="icon-size-5 mat-icon-primary" [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                            <span class="ml-auto">&nbsp;View</span>
                        </button>
                    </div>
                    <!-- id -->
                    <div class="mt-8 view-mode cursor-no-drop hidden" [matTooltip]="'Id can not be update.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>ID</mat-label>
                            <input matInput formControlName="id" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; " readonly />
                        </mat-form-field>
                    </div>
                    <!-- Code -->
                    <div class="mt-8 view-mode cursor-no-drop" [matTooltip]="'Code can not be update.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Code</mat-label>
                            <input matInput formControlName="qrCode" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; " readonly />
                        </mat-form-field>
                    </div>
                    <!-- Description -->
                    <div class="mt-8">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Description</mat-label>
                            <input matInput formControlName="resultDescription" style="padding: 13px;" />
                        </mat-form-field>
                    </div>
                    <!-- Active / InActive  -->
                    <div class="mt-4">
                        <div class="flex items-center">
                            <mat-checkbox formControlName="isActive" class="mr-2"></mat-checkbox>
                            <label class="text-lg">Active</label>
                        </div>
                    </div>
                    <!-- UPDATE BUTTON -->
                    <div class="flex justify-end ">
                        <button mat-flat-button [color]="'primary'" [disabled]="">
                            Update
                        </button>
                    </div>
                </div>
            </div>
        </div>
        }
        <!-- EDIT MODE ENDS -->
    </form>
</div>

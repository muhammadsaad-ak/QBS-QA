<div class="flex w-full flex-col">
    <!-- VIEW MODE STARTS -->
    <form [formGroup]="editQualitativeResultsForm" (ngSubmit)="onSubmit()">
        @if (!editMode) {
        <div class="flex w-full flex-col">
            <!-- HEADER -->
            <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12"
                style="background-image: linear-gradient(#233041, #1E293B);">
                <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
                    Qualitative Result
                </div>
                <!-- CLOSE BUTTON -->
                <div class="mx-auto flex w-full max-w-3xl items-center justify-end pt-4">
                    <a mat-icon-button [matTooltip]="'Close'">
                        <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
                    </a>
                </div>
            </div>
            <!-- MAIN -->
            <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
                <div class="w-full max-w-3xl">
                    <div class="mb-1 mt-2 flex justify-end">
                        <button mat-stroked-button (click)="toggleEditMode(true)">
                            <mat-icon class="icon-size-5 mat-icon-primary"
                                [svgIcon]="'heroicons_solid:pencil-square'"></mat-icon>
                            <span class="ml-2 text-primary-700">Edit</span>
                        </button>
                    </div>
                    <!-- Code -->
                    <div class="mt-8 view-mode cursor-no-drop" [matTooltip]="'You are in view mode.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Code</mat-label>
                            <input matInput formControlName="qrCode" [spellcheck]="false" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; " readonly />
                        </mat-form-field>
                    </div>
                    <!-- Description -->
                    <div class="mt-8 view-mode cursor-no-drop" [matTooltip]="'You are in view mode.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Code</mat-label>
                            <input matInput formControlName="qrDescription" [spellcheck]="false" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; border-radius: 1px !important " readonly />
                        </mat-form-field>
                    </div>
                </div>
            </div>
        </div>
        }
        <!-- VIEW MODE ENDS -->
        <!-- EDIT MODE STARTS -->
        @if (editMode) {
        <div class="flex w-full flex-col">
            <!-- HEADER -->
            <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12"
                style="background-image: linear-gradient(#233041, #1E293B);">
                <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
                    Qualitative Result
                </div>
                <!-- CLOSE BUTTON -->
                <div class="mx-auto flex w-full max-w-3xl items-center justify-end pt-4">
                    <a mat-icon-button [matTooltip]="'Close'">
                        <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
                    </a>
                </div>
            </div>
            <!-- MAIN -->
            <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
                <div class="w-full max-w-3xl">
                    <div class="mb-1 mt-2 flex justify-end">
                        <button mat-stroked-button (click)="toggleEditMode(false)">
                            <mat-icon class="icon-size-5" [svgIcon]="'heroicons_outline:eye'"></mat-icon>
                            <span class="ml-2">View</span>
                        </button>
                    </div>
                    <!-- Code -->
                    <div class="mt-8 view-mode cursor-no-drop" [matTooltip]="'Code can not be update.'">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Code</mat-label>
                            <input matInput formControlName="qrCode" [spellcheck]="false" class="cursor-no-drop"
                                style="background-color: #F3F4F6; padding: 13px; " readonly />
                        </mat-form-field>
                    </div>

                    <!-- Description -->
                    <div class="mt-8">
                        <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                            <mat-label>Description</mat-label>
                            <input matInput formControlName="qrDescription" [spellcheck]="false"
                                style="padding: 13px;" />
                        </mat-form-field>
                    </div>
                    <!-- UPDATE BUTTON -->
                    <div
                        class="sticky bottom-0 -mx-6 mt-40 flex items-center justify-end border-t bg-gray-50 py-4 pl-1 pr-4 dark:bg-transparent sm:-mx-12 sm:pl-7 sm:pr-12">
                        <button class="ml-2 w-1/3" mat-flat-button [color]="'primary'" [disabled]="">
                            Update
                        </button>
                    </div>
                </div>
            </div>
        </div>
        }
        <!-- EDIT MODE ENDS -->
    </form>
</div>

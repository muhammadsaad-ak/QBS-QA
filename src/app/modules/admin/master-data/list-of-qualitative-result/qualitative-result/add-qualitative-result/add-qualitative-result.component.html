<div class="flex w-full flex-col">
    <!-- HEADER -->
    <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12"
        style="background-image: linear-gradient(#233041, #1E293B);">
        <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
            Qualitative Result
        </div>
        <!-- CLOSE BUTTON -->
        <!-- <div class="mx-auto flex w-full max-w-3xl items-center justify-end pt-4">
            <a mat-icon-button [matTooltip]="'Close'">
                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
            </a>
        </div> -->
    </div>

    <!-- MAIN -->
    <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
        <div class="w-full max-w-3xl">
            <form [formGroup]="addQualitativeForm" (ngSubmit)="onSubmit()">
                <!-- Code -->
                <div class="mt-8">
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'" style="padding: 0.2rem !important;">
                        <mat-label>Code</mat-label>
                        <input matInput placeholder="Enter Code" [spellcheck]="false" formControlName="qrCode" />
                    </mat-form-field>
                </div>
                <!-- Description -->
                <div class="mt-8">
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                        <mat-label>Description</mat-label>
                        <input matInput placeholder="Enter Description" [spellcheck]="false"
                            formControlName="qrDescription" />
                    </mat-form-field>
                </div>
                <!-- ADD BUTTON  -->
                <div class="mt-1/3 flex justify-end ">
                    <button mat-flat-button [color]="'primary'" [disabled]="">
                        Save
                    </button>
                </div>
                <!-- <div
                    class="sticky bottom-0 -mx-6 mt-40 flex items-center justify-end border-t bg-gray-50 py-4 pl-1 pr-4 dark:bg-transparent sm:-mx-12 sm:pl-7 sm:pr-12">
                    <button class="ml-2 w-1/3" mat-flat-button [color]="'primary'" [disabled]="">
                        Add
                    </button>
                </div> -->

            </form>
        </div>
    </div>

</div>

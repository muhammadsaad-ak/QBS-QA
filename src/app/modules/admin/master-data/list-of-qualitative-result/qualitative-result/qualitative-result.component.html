<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
    <div class="relative flex-0 flex-col py-1 md:px-2">
        <div class="text-3xl font-extrabold tracking-tight px-4">{{title}}</div>
        <div class="py-0.5 flex flex-col sm:flex-row sm:justify-between">
            <mat-form-field class="icon-border-color qbs-mat-dense qbs-mat-rounded sm:w-2/3 md:w-1/4 px-2">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input matInput autocomplete="off" placeholder="Search..." [formControl]="searchInputControl" />
            </mat-form-field>
            <button class="mb-3 sm:mt-0 sm:ml-auto icon-border-color" mat-flat-button color="primary"
                (click)="openStepperToAddQR()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-1">{{ addBtnTitle }}</span>
            </button>
        </div>
    </div>
    <div *ngIf="dataSourcsQualitativeResults.data.length < 1 ; else showTable"
        class="border-t p-8 text-center text-4xl font-semibold tracking-tight sm:p-16">
        No records to show...
    </div>
    <ng-template #showTable>
        <div class="example-container shadow-xl shadow-gray-300">
            <table mat-table [dataSource]="dataSourcsQualitativeResults" class="table-border-color py-0">
                <ng-container matColumnDef="serialNo">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-100 hidden">S.No</th>
                    <td mat-cell *matCellDef="let element; let i = index" class="single-line font-medium hidden">{{ i + 1
                        }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="intCode">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Code</th>
                    <td mat-cell *matCellDef="let element" class="single-line font-medium">
                        QR-{{ element.intCode ? element.intCode.toString().padStart(5, '0') : '-' }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Description</th>
                    <td mat-cell *matCellDef="let element" class="single-line font-medium">
                        {{ element.resultDescription || '-' }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Status</th>
                    <td mat-cell *matCellDef="let element"
                        [ngClass]="['single-line', 'font-medium', element.isActive ? 'text-green-500' : 'text-amber-500']">
                        {{ element.isActive ? 'Active' : 'Inactive' }}
                    </td>
                </ng-container>
                <ng-container matColumnDef="action">
                    <th mat-header-cell *matHeaderCellDef class="bg-gray-100">Action</th>
                    <td mat-cell *matCellDef="let element">
                        <mat-icon svgIcon="heroicons_outline:pencil" class="mat-icon-primary cursor-pointer py-0.5"
                            (click)="openStepperToUpdateQR(element)">
                        </mat-icon>
                    </td>
                </ng-container>
                <tr mat-header-row *matHeaderRowDef="displayedColumnsQualitativeResults"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumnsQualitativeResults;"></tr>
            </table>
        </div>
        <mat-paginator class="border-pagination bg-gray-100" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons>
        </mat-paginator>
    </ng-template>
</div>

<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
  <div class="relative flex-0 flex-col py-1 md:px-2">
    <div class="text-3xl font-extrabold tracking-tight px-4">
      <mat-icon svgIcon="heroicons_solid:arrow-left" class="text-primary-700 mr-2 cursor-pointer hidden"
        (click)="onBackArrowClick()"></mat-icon>
      {{title}}
    </div>
    <div class="py-0.5 flex flex-col sm:flex-row sm:justify-between">
      <mat-form-field class="icon-border-color qbs-mat-dense qbs-mat-rounded sm:w-2/3 md:w-1/4 px-2">
        <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
        <input matInput autocomplete="off" placeholder="Search..." [formControl]="searchInputControl" />
      </mat-form-field>
      <button class="mb-3 sm:mt-0 sm:ml-auto icon-border-color" mat-flat-button color="primary"
        (click)="openStepperToAddIC()">
        <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
        <span class="ml-1">{{ addBtnTitle }}</span>
      </button>
    </div>
  </div>
  <div *ngIf="dataSource.data.length < 1 ; else showTable"
    class="border-t p-8 text-center text-4xl font-semibold tracking-tight sm:p-16">
    No records to show...
  </div>
  <ng-template #showTable>
    <div class="example-container shadow-xl shadow-gray-300">
      <table mat-table [dataSource]="dataSource" class="table-border-color py-0">
        <ng-container matColumnDef="serialId">
          <th mat-header-cell *matHeaderCellDef class="bg-gray-100 hidden">
            S.No
          </th>
          <td mat-cell *matCellDef="let index = index" class="single-line font-medium hidden">
            {{index + 1}}
          </td>
        </ng-container>
        <ng-container matColumnDef="intCode">
          <th mat-header-cell *matHeaderCellDef class="bg-gray-100">
            Card&nbsp;Code
          </th>
          <td mat-cell *matCellDef="let element" class="single-line font-medium">
            IC-{{ element.intCode ? (element.intCode.toString().padStart(5, '0')) : '-' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef class="bg-gray-100">
            Description
          </th>
          <td mat-cell *matCellDef="let element" class="single-line font-medium">
            {{element.description ? element.description : '-' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef class="bg-gray-100">
            Status
          </th>
          <td mat-cell *matCellDef="let element" class="single-line font-medium"
            [ngClass]="{'text-green-500': element.isActive, 'text-amber-500': !element.isActive}">
            {{ element.isActive ? 'Active' : 'Inactive' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef class="bg-gray-100">
            Actions
          </th>
          <td mat-cell *matCellDef="let element">
            <mat-icon matTooltip="Update" svgIcon="heroicons_outline:pencil" class="text-primary-700 cursor-pointer py-0.5"
              (click)="openStepperToUpdateIC(element)"></mat-icon>
            <mat-icon matTooltip="Duplicate Card" svgIcon="heroicons_outline:document-duplicate"
              class="text-primary-700 cursor-pointer py-0.5" (click)="openStepperToCloneIC(element)"></mat-icon>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <mat-paginator class="border-pagination bg-gray-100" [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons>
    </mat-paginator>
  </ng-template>
</div>

<div class="flex w-full flex-col">
     <!-- Header -->
     <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12" style="background-image: linear-gradient(#233041, #1E293B);">
        <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
            Add Inspection 1.0
        </div>
        <!-- Close button -->
        <div class="mx-auto flex w-full max-w-3xl items-center justify-end pt-4">
            <!-- [routerLink]="['../../projects']" -->
            <a mat-icon-button [matTooltip]="'Close'">
                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
            </a>
        </div>
    </div>

    <!-- Main -->
    <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
        <div class="w-full max-w-3xl">
            <form [formGroup]="addInspectionForm" (ngSubmit)="onSubmit()">

                <!-- Inspection Code -->
                <div class="mt-8">
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'" style="padding: 0.2rem !important;">
                        <mat-label>Inspection Code</mat-label>
                        <mat-icon matPrefix class="hidden icon-size-5 sm:flex"
                            [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                        <input matInput [placeholder]="'Inspection Code'" [spellcheck]="false" />
                    </mat-form-field>
                </div>

                 <!-- Description -->
                 <div class="mt-8">
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                        <mat-label>Description</mat-label>
                        <textarea matInput placeholder="Description" spellcheck="false"> QA Description Test.
                        </textarea>
                    </mat-form-field>
                </div>

                <!-- Checkboxes Section -->
                <div class="mt-8">
                    <div class="flex items-center">
                        <mat-checkbox class="mr-2"></mat-checkbox>
                        <label for="isSuperUser" class="text-lg">Active</label>
                    </div>
                </div>

                <!-- Qualitative and Quantitative Section -->
                <div class="mt-8 flex flex-col">
                    <!-- <div class="flex items-center">
                        <input type="radio" [formControlName]="'isSuperUser'" class="mr-2" />
                        <mat-label for="isSuperUser" class="text-lg">Qualitative</mat-label>
                    </div> -->
                    <span class="mb-2 font-semibold"
                                >Select Inspection</span
                            >
                            <mat-radio-group
                            class="flex flex-col"
                            [color]="'primary'"
                            [value]="'just-good'"
                            >
                                <mat-radio-button
                                class="mb-2"
                                [value]="'everything'"
                                >
                                    Qualitative Inspection
                                </mat-radio-button>

                                <mat-radio-button
                                class="mb-2"
                                [value]="'everything'"
                                >
                                    Quantitative Inspection
                                </mat-radio-button>

                            </mat-radio-group>
                </div>

                <!-- Main Card Section -->
                <div class="mt-4 ml-0 custom-table-style" >
                    <table class="min-w-full border border-gray-200 border-collapse">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">S.No</th>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Criteria</th>
                            </tr>
                        </thead>
                        <tbody  formArrayName="qualitativeCriteria">
                            <tr *ngFor="let row of qualitativeCriteria.controls; let i = index" [formGroupName]="i">
                              <td class="px-4 py-2 text-sm border-b">
                                      <input
                                      type="text"
                                      placeholder="Enter User Name"
                                      aria-label="User Name"
                                      matInput
                                      formControlName="userName"
                                      [matAutocomplete]="auto"
                                      [ngModelOptions]="{standalone: true}"
                                      
                                    />
                                    <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption (optionSelected)="onUserSelected($event, row, 'qualitativeCriteria')">
                                      <mat-option *ngFor="let user of users" [value]="user.userName">
                                        {{ user.userName }}
                                      </mat-option>
                                    </mat-autocomplete>
                                    <!-- Error Message for Name Field -->
                              </td>
                              <td class="px-4 py-2 text-sm border-b relative">
                                <input 
                                    formControlName="userId" readonly
                                    placeholder="Enter User Id" 
                                    class="w-full" 
                                    readonly
                                />
                                <!-- Add row button on the first row only -->
                                <!-- <span *ngIf="i === 0" class="absolute" style="top: 0.9rem; left: 10.2rem;">
                                  <button mat-icon-button (click)="addRow(i)" matTooltip="Add Row" style="background-color: rgb(243, 242, 242); width: 24px; height: 24px; padding: 0; font-size: 12px;">
                                    <mat-icon>add</mat-icon>
                                  </button>
                                </span> -->
                                <!-- Remove row button for every row except the first -->
                                <!-- <span *ngIf="i > 0" class="absolute" style="top: 0.9rem; left: 10.2rem;">
                                  <button mat-icon-button (click)="removeRow(i)" matTooltip="Remove Row" style="background-color: rgb(243, 242, 242); width: 24px; height: 24px; padding: 0; font-size: 12px;">
                                    <mat-icon>remove</mat-icon>
                                  </button>
                                </span> -->
                              </td>
                            </tr>
                          </tbody>
                    </table>
                <!-- <button mat-button (click)="addRow()">Add Row</button> -->
                </div>

                 <!-- Actions -->
                 <div
                 class="-mx-6 mt-10 flex items-center justify-end border-t bg-gray-50 py-4 pl-1 pr-4 dark:bg-transparent sm:-mx-12 sm:pl-7 sm:pr-12"
                 >
                 <!-- Save -->
                 <button class="ml-2 w-1/3" mat-flat-button [color]="'primary'" [disabled]="" [matTooltip]="'Add'">
                     Add
                 </button>
                 </div>

            </form>
        </div>
    </div>


</div>

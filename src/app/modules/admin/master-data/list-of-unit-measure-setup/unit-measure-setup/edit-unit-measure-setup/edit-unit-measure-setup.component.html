<div class="flex w-full flex-col">
    <!-- Header -->
    <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12" style="background-image: linear-gradient(#233041, #1E293B);">
       <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
            Edit UoM 0.2
       </div>
       <!-- Close button -->
       <div class="absolute right-4 top-4">
        <a mat-icon-button [matTooltip]="'Close'" >
            <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
        </a>

        
       </div>
   </div>

   <!-- Main -->
   @if(!editMode){
   <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
       <div class="w-full max-w-3xl">
           <form [formGroup]="editUnitMeasureSetupForm">
            <div class="mb-1 mt-2 w-full flex justify-end pr-4">
                <button mat-stroked-button (click)="toggleEditMode(true)">
                    <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:pencil-square'"></mat-icon>
                    <span class="ml-2">Edit</span>
                </button>
            </div>
            
               <!-- Code -->
            <div class="mt-8 view-mode cursor-no-drop">
                <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                    <mat-label>Code</mat-label>
                    <input 
                        matInput 
                        formControlName="UoMcode" 
                        [spellcheck]="false" 
                        class="cursor-no-drop" 
                        style="background-color: #F3F4F6; padding: 13px; " 
                    />
                </mat-form-field>
            </div>

               <!-- UoM Name -->
            <div class="mt-8 cursor-no-drop">
                <mat-form-field class="w-full view-mode" [subscriptSizing]="'dynamic'">
                    <mat-label>UoM Name</mat-label>
                    <input matInput formControlName = "UoMname" spellcheck="false"  class="cursor-no-drop" 
                    style="background-color: #F3F4F6; padding: 13px;" >
                </mat-form-field>
            </div>
           </form>
       </div>
   </div>
}

@if(editMode){
    <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
        <div class="w-full max-w-3xl">
            <form [formGroup]="editUnitMeasureSetupForm">
                <div class="mb-1 mt-2 mr-1 flex justify-end">
                    <button mat-stroked-button (click)="toggleEditMode(false)">
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:pencil-square'"></mat-icon>
                        <span class="ml-2">View</span>
                    </button>
                </div>
                        <!-- Code -->
                        <div class="mt-8 view-mode cursor-no-drop">
                            <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                                <mat-label>Code</mat-label>
                                <input 
                                    matInput 
                                    formControlName="UoMcode" 
                                    [spellcheck]="false" 
                                    class="cursor-no-drop" 
                                    style="background-color: #F3F4F6; padding: 13px; " 
                                />
                            </mat-form-field>
                        </div>
 
                
 
                        <div class="mt-8">
                            <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                                <mat-label>UoM Name</mat-label>
                                <input matInput formControlName = "UoMname" spellcheck="false" 
                                style=" padding: 13px;" >
                            </mat-form-field>
                        </div>
 
                 <!-- Actions -->
                 <div class="sticky bottom-0 -mx-6 mt-40 flex items-center justify-end border-t bg-gray-50 py-4 pl-1 pr-4 dark:bg-transparent sm:-mx-12 sm:pl-7 sm:pr-12">
                 <!-- Save -->
                 <button 
                    class="ml-2 w-1/3" mat-flat-button  [color]="'primary'" [disabled]="false" [matTooltip]="'Add'"(click)="onUpdate()">
                    Update
                 </button>
                 </div>
 
            </form>
        </div>
    </div>
 }

</div>

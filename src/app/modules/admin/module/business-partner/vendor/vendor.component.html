<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
 

  <!-- Header Starts -->
  <div class="relative flex-0 flex-col px-6 py-2 md:px-8">
    <!-- Title -->
        <div class="text-3xl font-extrabold tracking-tight">
        Vendor
        </div>
    </div>
    <!-- Actions - Search & Add button in the next line -->
    <div class="mt-4 flex flex-col items-start space-y-4 sm:flex-row sm:justify-start sm:space-y-0" style="margin-left: 1.5rem !important;">
            <!-- Search Input Field -->
            <mat-form-field class="qbs-mat-dense qbs-mat-rounded min-w-64 sm:w-2/3 md:w-1/2" style="padding-right: 3rem !important;">
                <mat-icon class="icon-size-5" matPrefix
                [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input matInput [autocomplete]="'off'" [placeholder]="'Search... '" [formControl]="searchInputControl"
                 />
            </mat-form-field>

           
    </div>




<div class=" overflow-auto max-h-[400px] sm:max-h-[600px]" style="max-height: 400px;"> <!-- Add this wrapper div -->
  <table mat-table [dataSource]="dataSource" class="w-full">
     

          <!-- Checkbox Column -->
           
           
          <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef>
              <mat-checkbox (change)="$event ? toggleAllRows() : null"
                [checked]="selection.hasValue() && isAllSelected()"
                [indeterminate]="selection.hasValue() && !isAllSelected()" [aria-label]="checkboxLabel()">
              </mat-checkbox>
            </th>
            <td mat-cell *matCellDef="let row">
              <mat-checkbox (click)="$event.stopPropagation()" (change)="$event ? selection.toggle(row) : null"
                [checked]="selection.isSelected(row)" [aria-label]="checkboxLabel(row)">
              </mat-checkbox>
            </td>
          </ng-container>

          <!-- Position Column -->
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef> BP Code </th>
            <td mat-cell *matCellDef="let element"> {{element.position}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> BP Name </th>
            <td mat-cell *matCellDef="let element"> {{element.name}} </td>
          </ng-container>

          <!-- Weight Column -->
          <ng-container matColumnDef="weight">
            <th mat-header-cell *matHeaderCellDef> BP Category </th>
            <td mat-cell *matCellDef="let element"> {{element.weight}} </td>
          </ng-container>

          <!-- Symbol Column -->
          <ng-container matColumnDef="symbol">
            <th mat-header-cell *matHeaderCellDef> Group Name </th>
            <td mat-cell *matCellDef="let element"> {{element.symbol}} </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" 
        class="bg-gray-200 text-gray-900">
    </tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)">
    </tr>
    </table>
    <!-- No data found message -->
    <div *ngIf="dataSource.filteredData.length === 0" class="no-data text-xl font-bold text-center p-5">
      No data found
    </div>
  </div>
  </div>

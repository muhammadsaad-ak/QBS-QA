<div class="flex w-full flex-col">

    <!-- Header -->
    <div class="relative h-20 w-full bg-accent-100 px-8 dark:bg-accent-700 sm:h-18 sm:px-12" style="background-image: linear-gradient(#233041, #1E293B);">
        <div class="mt-3 truncate text-4xl font-bold" style="color: aliceblue;">
            Add Approval Template
        </div>
        <!-- Close button -->
        <div class="mx-auto flex w-full max-w-3xl items-center justify-end pt-4">
            <!-- [routerLink]="['../../projects']" -->
            <a mat-icon-button [matTooltip]="'Close'">
                <mat-icon class="text-white" [svgIcon]="'heroicons_outline:x-mark'"></mat-icon>
            </a>
        </div>
    </div>

    <!-- Main -->
    <div class="relative flex flex-auto flex-col items-center px-6 sm:px-12">
        <div class="w-full max-w-3xl">
            <form [formGroup]="addApprovalForm" (ngSubmit)="onSubmit()">
                <!-- Approval Template Name -->
                <div class="mt-8">
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'" style="padding: 0.2rem !important;">
                        <mat-label>Name</mat-label>
                        <mat-icon matPrefix class="hidden icon-size-5 sm:flex"
                            [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                        <input matInput [formControlName]="'name'" [placeholder]="'Name'" [spellcheck]="false" />
                    </mat-form-field>
                </div>

                <!-- Number of Approvals -->
                <div class="mt-8">
                    <mat-form-field class="w-full" [subscriptSizing]="'dynamic'">
                        <mat-label>No. of Approvals</mat-label>
                        <mat-icon matPrefix class="hidden icon-size-5 sm:flex"
                            [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                        <input matInput [formControlName]="'noApprovals'" type="number" [placeholder]="'No. of Approvals'" [spellcheck]="false" />
                    </mat-form-field>
                </div>

                <!-- Active Checkbox -->
                <div class="mt-8">
                    <div class="flex items-center">
                        <mat-checkbox formControlName="isActive" class="mr-2"></mat-checkbox>
                        <label for="isActive" class="text-lg">Active</label>
                    </div>
                </div>

                <div class="mt-8" style="width: 28rem !important;">
                <mat-tab-group class="sm:px-2" mat-stretch-tabs="true" [animationDuration]="'0'"
                    style="margin-left: -1rem; margin-right: 1rem !important;"> 
                    <mat-tab label="Originator">
                        <ng-template matTabContent>
                                <!-- Main Card Section -->
                                <div class="mt-4 ml-0 custom-table-style" >
                                    <table class="min-w-full border border-gray-200 border-collapse">
                                        <thead>
                                            <tr>
                                                <th class="px-4 py-2 text-left text-sm font-medium border-b">User Name</th>
                                                <th class="px-4 py-2 text-left text-sm font-medium border-b">User Id</th>
                                            </tr>
                                        </thead>
                                        <tbody  formArrayName="originators">
                                            <tr *ngFor="let row of originators.controls; let i = index" [formGroupName]="i">
                                              <td class="px-4 py-2 text-sm border-b">
                                                      <input
                                                      type="text"
                                                      placeholder="Enter User Name"
                                                      aria-label="User Name"
                                                      matInput
                                                      formControlName="userName"
                                                      [matAutocomplete]="auto"
                                                      [ngModelOptions]="{standalone: true}"
                                                      
                                                    />
                                                    <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption (optionSelected)="onUserSelected($event, row, 'originators')">
                                                      <mat-option *ngFor="let user of users" [value]="user.userName">
                                                        {{ user.userName }}
                                                      </mat-option>
                                                    </mat-autocomplete>
                                                    <!-- Error Message for Name Field -->
                                              </td>
                                              <td class="px-4 py-2 text-sm border-b relative">
                                                <input 
                                                    formControlName="userId" readonly
                                                    placeholder="Enter User Id" 
                                                    class="w-full" 
                                                    readonly
                                                />
                                                <!-- Add row button on the first row only -->
                                                <!-- <span *ngIf="i === 0" class="absolute" style="top: 0.9rem; left: 10.2rem;">
                                                  <button mat-icon-button (click)="addRow(i)" matTooltip="Add Row" style="background-color: rgb(243, 242, 242); width: 24px; height: 24px; padding: 0; font-size: 12px;">
                                                    <mat-icon>add</mat-icon>
                                                  </button>
                                                </span> -->
                                                <!-- Remove row button for every row except the first -->
                                                <!-- <span *ngIf="i > 0" class="absolute" style="top: 0.9rem; left: 10.2rem;">
                                                  <button mat-icon-button (click)="removeRow(i)" matTooltip="Remove Row" style="background-color: rgb(243, 242, 242); width: 24px; height: 24px; padding: 0; font-size: 12px;">
                                                    <mat-icon>remove</mat-icon>
                                                  </button>
                                                </span> -->
                                              </td>
                                            </tr>
                                          </tbody>
                                    </table>
                                <!-- <button mat-button (click)="addRow()">Add Row</button> -->
                                </div>
                        </ng-template>
                       
                    </mat-tab>

                    <mat-tab label="Approver">
                        <ng-template matTabContent>
                            <!-- Main Card Section -->
                            <div class="mt-4 ml-0 custom-table-style" >
                                <table class="min-w-full border border-gray-200 border-collapse">
                                    <thead>
                                        <tr>
                                            <th class="px-4 py-2 text-left text-sm font-medium border-b">User Name</th>
                                            <th class="px-4 py-2 text-left text-sm font-medium border-b">User Id</th>
                                        </tr>
                                    </thead>
                                    <tbody  formArrayName="approvers">
                                        <tr *ngFor="let row of approvers.controls; let i = index" [formGroupName]="i">
                                          <td class="px-4 py-2 text-sm border-b">
                                                  <input
                                                  type="text"
                                                  placeholder="Enter User Name"
                                                  aria-label="User Name"
                                                  matInput
                                                  formControlName="userName"
                                                  [matAutocomplete]="auto"
                                                  [ngModelOptions]="{standalone: true}"
                                                  
                                                />
                                                <mat-autocomplete #auto="matAutocomplete" autoActiveFirstOption (optionSelected)="onUserSelected($event, row, 'approvers')">
                                                  <mat-option *ngFor="let user of users" [value]="user.userName">
                                                    {{ user.userName }}
                                                  </mat-option>
                                                </mat-autocomplete>
                                                <!-- Error Message for Name Field -->
                                          </td>
                                          <td class="px-4 py-2 text-sm border-b relative">
                                            <input 
                                                    formControlName="userId" readonly
                                                    placeholder="Enter User Id" 
                                                    class="w-full" 
                                                    readonly
                                                />
                                            <!-- Add row button on the first row only -->
                                            <!-- <span *ngIf="i === 0" class="absolute" style="top: 0.9rem; left: 10.2rem;">
                                              <button mat-icon-button (click)="addRow(i)" matTooltip="Add Row" style="background-color: rgb(243, 242, 242); width: 24px; height: 24px; padding: 0; font-size: 12px;">
                                                <mat-icon>add</mat-icon>
                                              </button>
                                            </span> -->
                                            <!-- Remove row button for every row except the first -->
                                            <!-- <span *ngIf="i > 0" class="absolute" style="top: 0.9rem; left: 10.2rem;">
                                              <button mat-icon-button (click)="removeRow(i)" matTooltip="Remove Row" style="background-color: rgb(243, 242, 242); width: 24px; height: 24px; padding: 0; font-size: 12px;">
                                                <mat-icon>remove</mat-icon>
                                              </button>
                                            </span> -->
                                          </td>
                                        </tr>
                                      </tbody>
                                </table>
                                <!-- <button mat-button (click)="addRow()">Add Row</button> -->
                            </div>
                    </ng-template>

                    </mat-tab>

                    <mat-tab label="Module">
                      <ng-template matTabContent>
                        <div class="mt-4 space-y-4">
                          <div *ngFor="let module of modulesFormArray.controls; let i = index" [formGroup]="module">
                            <mat-checkbox formControlName="isAllowed">
                              {{ module.get('moduleName')?.value }}
                            </mat-checkbox>
                          </div>
                        </div>
                      </ng-template>
                    </mat-tab>
                </mat-tab-group>
                </div>

                <!-- Actions -->
                <div
                class="-mx-6 mt-10 flex items-center justify-end border-t bg-gray-50 py-4 pl-1 pr-4 dark:bg-transparent sm:-mx-12 sm:pl-7 sm:pr-12"
                >
                <!-- Save -->
                <button class="ml-2 w-1/3" mat-flat-button [color]="'primary'" [disabled]="" [matTooltip]="'Add'">
                    Add
                </button>
                </div>
            </form>
        </div>
    </div>
</div>

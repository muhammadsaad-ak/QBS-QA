<!-- Main Wrapper Starts -->
<div class="dialog-container max-h-screen overflow-auto">
    <!-- Header Starts -->
    <div class="flex justify-between items-center p-4 border-b bg-primary text-white"
        style="background-image: linear-gradient(#233041, #1E293B);">
        <h2 class="text-lg font-semibold">Add Role</h2>
        <span (click)="matDialogRef.close()" class="header-close-x">
            <mat-icon class="text-white">close</mat-icon>
        </span>
    </div>
    <!-- Header Ends-->

    <!-- Role Name -->
    <div class="mt-3 ml-2">
        <form [formGroup]="addNewRole">
            <mat-form-field class="w-1/3" appearance="fill" style="padding: 0.2rem !important;">
                <mat-label>Role Name</mat-label>
                <mat-icon matPrefix class="hidden icon-size-5 sm:flex"
                    [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                <input matInput formControlName="roleName" placeholder="Role Name" spellcheck="false" />
            </mat-form-field>
        </form>
    </div>

    <!-- Loading bar -->
    <!-- <qbs-loading-bar></qbs-loading-bar> -->
    <!-- Tree Structure Starts -->
    <div class="mt-3 ml-2" style="font-weight: 500;">
        <mat-label>Select Access</mat-label>
    </div>
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree tree-with-lines mt-3">
            <!-- Expandable Node -->
            <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                <div class="mat-tree-node mat-tree-node-expandable">
                    <mat-checkbox [disabled]="node.disabled" [checked]="node.checked || false" 
                        (change)="onNodeChecked(node, $event.checked)">
                    </mat-checkbox>
                    <button *ngIf="!shouldRenderTable(node)" mat-icon-button [attr.aria-label]="'Toggle ' + node.name" (click)="toggleNode(node)">
                        <mat-icon>
                            {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                        </mat-icon>
                    </button>
                    <span>{{ node.name }}</span>
                </div>
                <!-- Hide this div when the table is rendered -->
                <div *ngIf="treeControl.isExpanded(node)" role="group">
                    <ng-container matTreeNodeOutlet></ng-container>
                </div>
    
                <!-- Fields Table Rendering -->
                <div *ngIf="shouldRenderTable(node)" class="mt-4 ml-24" style="width: 34rem !important;">
                    <table class="min-w-full border border-gray-200">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Field Name</th>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Auth Type</th>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Mandatory</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let field of node.children">
                                <!-- Field Name with Checkbox -->
                                <td class="px-4 py-2 text-sm border-b">
                                    <mat-checkbox [(ngModel)]="field.checked">{{ field.name }}</mat-checkbox>
                                </td>
    
                                <!-- Auth Type with mat-select -->
                                <td class="px-4 py-2 text-sm border-b">
                                    <mat-form-field appearance="outline" class="w-full">
                                        <mat-select placeholder="Select Auth Type" [(ngModel)]="field.authType">
                                            <mat-option value="authorization">Authorization</mat-option>
                                            <mat-option value="no-authorization">No Authorization</mat-option>
                                            <mat-option value="read-only">Read Only</mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </td>
    
                                <!-- Mandatory with Checkbox -->
                                <td class="px-4 py-2 text-sm border-b">
                                    <mat-checkbox [(ngModel)]="field.mandatory"></mat-checkbox>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </mat-nested-tree-node>
        </mat-tree>
   
    <!-- Tree Structure Ends -->

    <!-- Footer -->
    <div class="flex justify-end p-4 border-t" style="margin-top: 25.6rem;">
        <button mat-flat-button color="primary" (click)="onSubmit()">Add</button>
    </div>
</div>
<!-- Main Wrapper Ends -->

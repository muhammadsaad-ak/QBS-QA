<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">

    <!-- Header Starts -->
    <div class="relative flex-0 flex-col px-6 py-2 md:px-8">
        <!-- Title -->
        <div class="text-3xl font-extrabold tracking-tight">
            Role Management
        </div>
    </div>
    <!-- Actions - Role Selection & Add button -->
    <div class="mt-4 flex flex-col items-start space-y-4 sm:flex-row sm:justify-start sm:space-y-0"
        style="margin-left: 1.5rem !important;">
        <!-- Role Selection Dropdown -->
        <mat-form-field class="qbs-mat-dense qbs-mat-rounded min-w-64 sm:w-2/3 md:w-1/2"
            style="padding-right: 3rem !important;">
            <mat-select placeholder="Select Role" [(ngModel)]="selectedRole" (selectionChange)="onRoleChange()">
                <mat-option *ngFor="let role of roles" [value]="role.id">
                    {{ role.name }}
                </mat-option>
            </mat-select>
        </mat-form-field>

        <!-- Add User Button -->
        <button class="mr-4" mat-flat-button [color]="'primary'" (click)="openAddEmployeeDialog()">
            <span class="ml-1 mr-1">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                {{ addRoleBtn }}
            </span>
        </button>
    </div>
    <!-- Main Content -->
    <div class="flex flex-auto border-t pt-4 sm:pt-2" style="overflow-y: scroll !important;">
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="example-tree tree-with-lines">
            <!-- Expandable Node -->
            <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                <div class="mat-tree-node mat-tree-node-expandable">
                    <!-- Attach matTreeNodeToggle to the checkbox only -->
                    <!-- <mat-checkbox class="mr-2 hover-checkbox" (change)="onNodeChecked(node, $event.checked)"
                                [checked]="node.checked || false" aria-label="Toggle selection for {{ node.name }}"
                                matTreeNodeToggle></mat-checkbox> -->
                    <mat-checkbox [disabled]="node.disabled" [checked]="node.checked || false"
                        (change)="onNodeChecked(node, $event.checked)">
                    </mat-checkbox>
                    <button *ngIf="!shouldRenderTable(node)" mat-icon-button [attr.aria-label]="'Toggle ' + node.name" (click)="toggleNode(node)">
                        <mat-icon>
                            {{ treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
                        </mat-icon>
                    </button>
                    <span>{{ node.name }}</span>
                </div>

                <!-- Hide this div when the table is rendered -->
                <div [class.example-tree-invisible]="shouldRenderTable(node) || !treeControl.isExpanded(node)"
                    role="group">
                    <ng-container matTreeNodeOutlet></ng-container>
                </div>

                <!-- Fields Table Rendering -->
                <div *ngIf="shouldRenderTable(node) " class="mt-4 ml-24">
                    <table class="min-w-full border border-gray-200">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Field Name</th>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Auth Type</th>
                                <th class="px-4 py-2 text-left text-sm font-medium border-b">Mandatory</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let field of node.children">
                                <!-- Field Name with Checkbox -->
                                <td class="px-4 py-2 text-sm border-b">
                                    <mat-checkbox 
                                    [(ngModel)]="field.checked"
                                    (change)="onNodeChecked(node, $event.checked)"
                                    >{{ field.name }}</mat-checkbox>
                                </td>

                                <!-- Auth Type with mat-select -->
                                <td class="px-4 py-2 text-sm border-b">
                                    <mat-form-field appearance="outline" class="w-full">
                                        <mat-select placeholder="Select Auth Type" [(ngModel)]="field.authType">
                                            <mat-option value="authorization">Authorization</mat-option>
                                            <mat-option value="no-authorization">No Authorization</mat-option>
                                            <mat-option value="read-only">Read Only</mat-option>
                                        </mat-select>
                                    </mat-form-field>
                                </td>

                                <!-- Mandatory with Checkbox -->
                                <td class="px-4 py-2 text-sm border-b">
                                    <mat-checkbox [(ngModel)]="field.mandatory"></mat-checkbox>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </mat-nested-tree-node>

        </mat-tree>
    </div>
    <!-- <div class="flex justify-end p-4 border-t" style="margin-top: 25.6rem;">
                <button mat-flat-button color="primary" (click)="onSubmit()">Update</button>
            </div> -->
</div>
